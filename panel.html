<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Panel de Agenda</title>
  <style>
    :root {
      --primary: #1565C0;
      --bg: #EEF2F6;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --muted: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 28px 16px;
    }
    .panel-box {
      max-width: 1080px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }
    .header {
      margin-bottom: 18px;
    }
    .header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }
    .header .sub {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 500;
    }
    .toolbar {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }
    input[type="password"], input[type="date"] {
      padding: 10px 14px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 0.95rem;
      background: #FFFFFF;
      color: var(--text);
      outline: none;
    }
    input[type="password"]:focus, input[type="date"]:focus {
      border-color: var(--primary);
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      color: #FFFFFF;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--primary); }
    .btn-tomorrow { background: #0284C7; }
    .btn-wa-batch { background: #16A34A; }
    .btn-wa {
      background: #16A34A;
      padding: 7px 12px;
      font-size: 0.84rem;
      border-radius: 8px;
    }
    .btn-cancel {
      background: #DC2626;
      padding: 7px 12px;
      font-size: 0.84rem;
      border-radius: 8px;
    }
    .status-banner {
      background: #ECFDF5;
      border: 1px solid #86EFAC;
      color: #166534;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .status-banner.error {
      background: #FEF2F2;
      border-color: #FCA5A5;
      color: #B91C1C;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      background: #F1F5F9;
      color: #334155;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }
    tbody td {
      padding: 14px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.94rem;
      vertical-align: middle;
    }
    .code-pill {
      display: inline-block;
      background: #DBEAFE;
      color: #1E40AF;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .badge-sent {
      display: inline-block;
      background: #DCFCE7;
      color: #166534;
      border: 1px solid #86EFAC;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .badge-pending {
      display: inline-block;
      background: #FEF9C3;
      color: #854D0E;
      border: 1px solid #FDE047;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .actions-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="panel-box">
    <div class="header">
      <h1 id="panelTitle">Panel · Agenda</h1>
      <div class="sub" id="panelSub">Cargando configuración...</div>
    </div>

    <div class="toolbar">
      <input type="password" id="adminPass" placeholder="Clave Panel" />
      <input type="date" id="filterDate" />
      <button class="btn-primary" onclick="loadBookings()">Cargar Citas</button>
      <button class="btn-tomorrow" onclick="loadTomorrowBookings()">Ver Mañana</button>
      <button class="btn-wa-batch" onclick="sendBatchTomorrowWa()">Avisar Pendientes de Mañana (WhatsApp)</button>
    </div>

    <div id="statusBanner" class="status-banner" style="display:none;"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Horario</th>
            <th>Cliente / Paciente</th>
            <th>Teléfono</th>
            <th>Servicio / Motivo</th>
            <th>Código</th>
            <th>Aviso WA</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="bookingsBody">
          <tr>
            <td colspan="7" style="text-align:center; color:#64748B; padding:20px;">
              Introduce la clave del panel y pulsa "Cargar Citas".
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const MASTER_GAS_URL = "https://script.google.com/macros/s/AKfycbxmbvJkocw-nHgpQGUp5ODYvRb-m1AuvblmBkU_VIOJ5RHLR2uCMsMkBQP_PqGm7CKZ/exec";
    const params = new URLSearchParams(window.location.search);
    const AGENDA_CODE = (params.get("agenda") || "").trim().toUpperCase();

    let BIZ_NAME = AGENDA_CODE;
    let currentBookings = [];

    function toYMD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getTomorrowYMD() {
      const t = new Date();
      t.setDate(t.getDate() + 1);
      return toYMD(t);
    }

    document.getElementById("filterDate").value = toYMD(new Date());

    function showBanner(msg, isError) {
      const el = document.getElementById("statusBanner");
      el.textContent = msg;
      el.className = "status-banner" + (isError ? " error" : "");
      el.style.display = "block";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function initPanel() {
      if (!AGENDA_CODE) {
        document.getElementById("panelSub").textContent = "Falta el parámetro ?agenda=CODIGO en la URL.";
        return;
      }
      document.getElementById("panelSub").textContent = `Agenda: ${AGENDA_CODE} · Conectando...`;
      try {
        const res = await fetch(MASTER_GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "getConfig",
            agendaCode: AGENDA_CODE,
            payload: {}
          })
        }).then(r => r.json());

        if (res.resultCode === "OK" && res.data) {
          const cfg = res.data.config || {};
          const status = res.data.status || "ACTIVO";
          BIZ_NAME = cfg.nombreNegocio || AGENDA_CODE;
          if (cfg.colorPrimario) {
            document.documentElement.style.setProperty("--primary", cfg.colorPrimario);
          }
          document.title = `Panel · ${BIZ_NAME}`;
          document.getElementById("panelTitle").textContent = `Panel · ${BIZ_NAME}`;
          document.getElementById("panelSub").textContent = `Agenda: ${AGENDA_CODE} · Estado: ${status}`;
        }
      } catch (e) {
        document.getElementById("panelSub").textContent = `Agenda: ${AGENDA_CODE}`;
      }
    }

    function normalizeWaPhone(raw) {
      let digits = String(raw || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.startsWith("00")) digits = digits.slice(2);
      if (digits.length === 9 && /^[6789]/.test(digits)) {
        return "34" + digits;
      }
      return digits;
    }

    function waStorageKey(b) {
      return `wa_notified_${AGENDA_CODE}_${b.bookingId || ""}_${b.startIso || ""}`;
    }

    function isWaNotified(b) {
      try { return localStorage.getItem(waStorageKey(b)) === "1"; } catch (e) { return false; }
    }

    function markWaNotified(b) {
      try { localStorage.setItem(waStorageKey(b), "1"); } catch (e) {}
    }

    function buildWaUrl(b) {
      const waPhone = normalizeWaPhone(b.phone);
      if (!waPhone) return "";
      const dtStart = new Date(b.startIso);
      const fechaEs = dtStart.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
      const horaEs = dtStart.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      const nombre = (b.firstName || "").trim() || "cliente";
      const servicio = (b.serviceName || "tu cita").trim();
      const cod = (b.reservationCode || "").trim();

      const lines = [
        `Hola ${nombre}, te recordamos tu cita en *${BIZ_NAME}*:`,
        `📅 *Fecha:* ${fechaEs}`,
        `⏰ *Hora:* ${horaEs}`,
        `📋 *Servicio:* ${servicio}`
      ];
      if (cod) lines.push(`🔑 *Código:* ${cod}`);
      lines.push("¡Te esperamos!");

      return `https://wa.me/${waPhone}?text=${encodeURIComponent(lines.join("\n"))}`;
    }

    function openSingleWa(idx) {
      const b = currentBookings[idx];
      if (!b) return;
      const url = buildWaUrl(b);
      if (!url) {
        alert("Esta cita no tiene un teléfono válido registrado.");
        return;
      }
      markWaNotified(b);
      renderTable();
      window.open(url, "_blank", "noopener");
    }

    function renderTable() {
      const tbody = document.getElementById("bookingsBody");
      tbody.innerHTML = "";

      if (!currentBookings.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748B; padding:20px;">No hay citas registradas para esta fecha.</td></tr>`;
        return;
      }

      currentBookings.forEach((b, idx) => {
        const hIni = new Date(b.startIso).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
        const hFin = new Date(b.endIso).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
        const fullName = `${b.firstName || ""} ${b.lastName || ""}`.trim() || b.title;
        const waPhone = normalizeWaPhone(b.phone);
        const notified = isWaNotified(b);

        const waBadge = !waPhone
          ? `<span style="color:#94A3B8; font-size:0.8rem;">Sin tel.</span>`
          : (notified
              ? `<span class="badge-sent">✓ Avisado</span>`
              : `<span class="badge-pending">Pendiente</span>`);

        const waButton = waPhone
          ? `<button class="btn-wa" onclick="openSingleWa(${idx})">WhatsApp</button>`
          : "";

        const codeBadge = b.reservationCode
          ? `<span class="code-pill">${escapeHtml(b.reservationCode)}</span>`
          : `-`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${hIni} - ${hFin}</strong></td>
          <td>${escapeHtml(fullName)}</td>
          <td>${escapeHtml(b.phone || "-")}</td>
          <td>
            ${escapeHtml(b.serviceName || b.title)}
            ${b.reason ? `<br><small style="color:#64748B;">${escapeHtml(b.reason)}</small>` : ""}
          </td>
          <td>${codeBadge}</td>
          <td>${waBadge}</td>
          <td>
            <div class="actions-group">
              ${waButton}
              <button class="btn-cancel" onclick="cancelBooking('${escapeHtml(b.bookingId)}')">Cancelar</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function fetchBookingsForDate(ds) {
      const pass = document.getElementById("adminPass").value;
      if (!pass) {
        showBanner("Introduce la clave del panel antes de consultar las citas.", true);
        return null;
      }

      showBanner(`Consultando citas para el ${ds}...`, false);
      try {
        const res = await fetch(MASTER_GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "adminListBookings",
            agendaCode: AGENDA_CODE,
            payload: {
              adminPassword: pass,
              startIso: new Date(`${ds}T00:00:00`).toISOString(),
              endIso: new Date(`${ds}T23:59:59`).toISOString()
            }
          })
        }).then(r => r.json());

        if (res.resultCode !== "OK") {
          showBanner(res.resultMessage || "Error cargando citas.", true);
          return null;
        }

        currentBookings = ((res.data && res.data.bookings) || [])
          .sort((a, b) => new Date(a.startIso) - new Date(b.startIso));

        renderTable();
        const pendientesWa = currentBookings.filter(b => normalizeWaPhone(b.phone) && !isWaNotified(b)).length;
        showBanner(`Se han encontrado ${currentBookings.length} cita(s) para el ${ds} · Pendientes de aviso WhatsApp: ${pendientesWa}.`, false);
        return currentBookings;
      } catch (e) {
        showBanner("Error de conexión: " + e.message, true);
        return null;
      }
    }

    async function loadBookings() {
      const ds = document.getElementById("filterDate").value;
      if (!ds) return;
      await fetchBookingsForDate(ds);
    }

    async function loadTomorrowBookings() {
      const tomorrow = getTomorrowYMD();
      document.getElementById("filterDate").value = tomorrow;
      await fetchBookingsForDate(tomorrow);
    }

    async function sendBatchTomorrowWa() {
      const tomorrow = getTomorrowYMD();
      document.getElementById("filterDate").value = tomorrow;
      const list = await fetchBookingsForDate(tomorrow);
      if (!list) return;

      const pendientes = list.filter(b => normalizeWaPhone(b.phone) && !isWaNotified(b));
      if (!pendientes.length) {
        alert(`No quedan citas pendientes de avisar por WhatsApp para mañana (${tomorrow}).`);
        return;
      }

      if (!confirm(`Hay ${pendientes.length} cita(s) pendiente(s) de avisar para mañana (${tomorrow}).\n\nSe abrirá WhatsApp para cada cliente uno por uno y se marcarán como avisados. ¿Comenzar?`)) {
        return;
      }

      for (let i = 0; i < pendientes.length; i++) {
        const b = pendientes[i];
        const url = buildWaUrl(b);
        const hora = new Date(b.startIso).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
        const nombre = `${b.firstName || ""} ${b.lastName || ""}`.trim() || b.phone;

        if (i > 0) {
          const seguir = confirm(`Siguiente aviso (${i + 1} de ${pendientes.length}):\n${hora} - ${nombre} (${b.phone})\n\nPulsa Aceptar para abrir su WhatsApp o Cancelar para detener.`);
          if (!seguir) break;
        }

        markWaNotified(b);
        renderTable();
        window.open(url, "_blank", "noopener");
      }

      const restantes = currentBookings.filter(b => normalizeWaPhone(b.phone) && !isWaNotified(b)).length;
      showBanner(`Se han encontrado ${currentBookings.length} cita(s) para el ${tomorrow} · Pendientes de aviso WhatsApp: ${restantes}.`, false);
    }

    async function cancelBooking(bookingId) {
      if (!confirm("¿Seguro que deseas cancelar esta cita definitivamente?")) return;
      const pass = document.getElementById("adminPass").value;
      try {
        const res = await fetch(MASTER_GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "adminCancelBooking",
            agendaCode: AGENDA_CODE,
            payload: {
              adminPassword: pass,
              bookingId: bookingId
            }
          })
        }).then(r => r.json());

        if (res.resultCode === "OK") {
          loadBookings();
        } else {
          alert(res.resultMessage || "No se pudo cancelar la cita.");
        }
      } catch (e) {
        alert("Error de conexión: " + e.message);
      }
    }

    initPanel();
  </script>
</body>
</html>
